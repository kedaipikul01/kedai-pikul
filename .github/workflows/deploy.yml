
name: Deploy Kedai Pikul to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0

      # 3. Check environment
      - name: Check environment
        run: |
          echo "Checking Node.js environment..."
          node --version
          npm --version
          echo "Environment ready!"

      # 4. Check project files
      - name: Check project files
        run: |
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          echo "Project files found!"

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      # 6. Fix executable permissions
      - name: Fix executable permissions
        run: |
          chmod +x node_modules/.bin/vite
          chmod +x node_modules/vite/bin/vite.js
          echo "Vite executable permissions fixed!"

      # 7. Verify Vite installation
      - name: Verify Vite installation
        run: |
          ls -l node_modules/.bin/vite
          node_modules/.bin/vite --version

      # 8. Build website
      - name: Build website
        run: npm run build

      # 9. Verify build output
      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "Build successful!"
          echo "Build directory:"
          ls -lah dist

      # 10. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 11. Upload build artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 12. Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 13. Display deployment result
      - name: Deployment result
        run: |
          echo "=================================="
          echo "KEDAI PIKUL DEPLOYMENT SUCCESS!"
          echo "=================================="
          echo "Website: ${{ steps.deployment.outputs.page_url }}"
