
name: Deploy Kedai Pikul to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Check project
      - name: Check project files
        run: |
          echo "Checking Kedai Pikul project..."
          test -f package.json
          test -f index.html
          test -f vite.config.ts
          echo "Project files found!"

      # 5. Build website
      - name: Build website
        run: npm run build

      # 6. Check build output
      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "Build successful!"
          ls -la dist

      # 7. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 8. Upload build files
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # 9. Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 10. Show website URL
      - name: Deployment result
        run: |
          echo "KEDAI PIKUL WEBSITE SUCCESSFULLY DEPLOYED!"
          echo "Website URL: ${{ steps.deployment.outputs.page_url }}"
